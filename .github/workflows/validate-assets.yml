name: Validate Olympic lakehouse assets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-json-and-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate JSON, notebook structure, and YAML
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          errors = []
          json_files = sorted(
              path for path in Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in {".json", ".ipynb"}
              and ".git" not in path.parts
          )
          yaml_files = sorted(
              path for path in Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in {".yml", ".yaml"}
              and ".git" not in path.parts
          )

          for path in json_files:
              try:
                  with path.open(encoding="utf-8") as handle:
                      payload = json.load(handle)
                  if path.suffix.lower() == ".ipynb":
                      if not isinstance(payload.get("cells"), list):
                          raise ValueError("notebook is missing a cells array")
                      for index, cell in enumerate(payload["cells"]):
                          if cell.get("cell_type") == "code" and not isinstance(cell.get("source"), (str, list)):
                              raise ValueError(f"code cell {index} has an invalid source field")
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          for path in yaml_files:
              try:
                  with path.open(encoding="utf-8") as handle:
                      yaml.safe_load(handle)
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          print(f"Checked {len(json_files)} JSON/notebook files and {len(yaml_files)} YAML files.")
          if errors:
              print("\nValidation errors:")
              for error in errors:
                  print(f"- {error}")
              raise SystemExit(1)
          print("All JSON, notebook structure, and YAML checks passed.")
          PY
